<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Drop shadow -->
  <ellipse cx="32" cy="52" rx="22" ry="8" fill="#0b0c0f" opacity="0.6"/>
  <!-- Open chest lid (angled back) -->
  <path d="M 12 24 L 14 6 L 50 6 L 52 24 Z" fill="#523319" stroke="#2b1a0e" stroke-width="2"/>
  <rect x="18" y="8" width="28" height="12" fill="#3a2310"/>
  <!-- Chest interior (filled with gold coins and gems) -->
  <rect x="12" y="24" width="40" height="26" rx="2" fill="#3d2513" stroke="#2b1a0e" stroke-width="2"/>
  <ellipse cx="32" cy="32" rx="16" ry="6" fill="#f59e0b"/>
  <!-- Gold coin pile glints -->
  <circle cx="24" cy="30" r="3" fill="#fbbf24"/>
  <circle cx="32" cy="33" r="3.5" fill="#fde047"/>
  <circle cx="40" cy="31" r="3" fill="#fbbf24"/>
  <!-- Rubies / Gems -->
  <polygon points="28,32 30,29 32,32 30,35" fill="#ef4444"/>
  <polygon points="36,33 38,30 40,33 38,36" fill="#3b82f6"/>
  <!-- Iron corner reinforcements -->
  <rect x="12" y="24" width="6" height="26" fill="#363c45" stroke="#1c1f24" stroke-width="1"/>
  <rect x="46" y="24" width="6" height="26" fill="#363c45" stroke="#1c1f24" stroke-width="1"/>
</svg>
